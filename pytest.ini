[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    -ra

markers =
    api: marks tests as API tests
    users: marks tests related to Users API
    resources: marks tests related to Resources API
    auth: marks tests related to Auth API
    smoke: quick sanity checks
    regression: full regression suite

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S